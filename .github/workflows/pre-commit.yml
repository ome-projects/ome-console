name: Pre-commit

# Pull requests only. On a push to main the checkout leaves HEAD on the main
# branch, which the no-commit-to-branch hook is designed to reject.
on:
  pull_request:
    branches: [main, release-*]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '23'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The prettier-check, eslint and typecheck hooks shell out to the
      # frontend's local binaries, so node_modules must exist first.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (commit stage)
        id: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run pre-commit (push stage)
        id: pre-commit-push
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

      - name: Post failure comment on PR
        if: failure() && (steps.pre-commit.outcome == 'failure' || steps.pre-commit-push.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const body = `⚠️ **Pre-commit checks failed**\n\nPlease run the following locally and commit the fixes:\n\`\`\`bash\npre-commit run --all-files\npre-commit run --all-files --hook-stage pre-push\ngit add -u && git commit\n\`\`\`\nSee [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#pre-commit-check) for setup instructions.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
